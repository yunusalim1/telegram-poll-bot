name: Daily Verdişlər Poll

on:
  schedule:
    # Hər gün saat 08:00 Bakı vaxtı (UTC+4) = 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: {}   # istəsən əl ilə də işə sala bilərsən

jobs:
  send-poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python send_poll.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
